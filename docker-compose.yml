version: "3.9"

services:
  app:
    build: .
    container_name: llm_security_gateway_app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:17
    container_name: llm_gateway_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: llm_gateway
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: llm_gateway_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: